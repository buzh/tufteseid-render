name: build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tufteseid-render:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: docker run --rm tufteseid-render:pr python -c "import server"
